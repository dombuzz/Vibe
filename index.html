<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#d8232a">
<title>Ohrmarkenabfrage</title>
<style>
  :root{
    --bg:#f3f4f5; --surface:#ffffff; --ink:#1f2328; --mut:#5d6670; --line:#d4d9de;
    --red:#d8232a; --red-ink:#ffffff; --red-dark:#b01c22; --tint:#eef0f2; --ok:#1d6b3a; --okbg:#e6f2ea; --newbg:#e8eef7; --new:#1f4e8c;
    --focus:#1a5fb4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171a; --surface:#1d2125; --ink:#e9ecef; --mut:#a2acb6; --line:#363c43;
      --red:#e5484d; --red-ink:#ffffff; --red-dark:#f06a6e; --tint:#262b31; --ok:#7fd29a; --okbg:#1b2d22; --newbg:#1c2735; --new:#8db8f0;
      --focus:#7aa7e8;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171a; --surface:#1d2125; --ink:#e9ecef; --mut:#a2acb6; --line:#363c43;
    --red:#e5484d; --red-ink:#ffffff; --red-dark:#f06a6e; --tint:#262b31; --ok:#7fd29a; --okbg:#1b2d22; --newbg:#1c2735; --new:#8db8f0;
    --focus:#7aa7e8;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
  .topbar{background:var(--surface);border-top:5px solid var(--red);border-bottom:1px solid var(--line)}
  .topin{max-width:560px;margin:0 auto;padding:14px 16px 12px}
  .topin .org{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
  .topin h1{margin:0;font-size:24px;font-weight:700;line-height:1.2}
  .topin p{margin:6px 0 0;font-size:14px;color:var(--mut)}
  .topin{position:relative}
  .topin h1{padding-right:48px}
  .tbtn{position:absolute;top:12px;right:16px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;opacity:.8}
  .tbtn:hover{opacity:1;color:var(--ink)}
  .tbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tbtn .sun{display:none}
  :root[data-eff="dark"] .tbtn .sun{display:block}
  :root[data-eff="dark"] .tbtn .moon{display:none}
  main{max-width:560px;margin:0 auto;padding:16px}
  section{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:16px;margin-bottom:16px}
  h2{margin:0 0 12px;font-size:16px;font-weight:700}
  label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
  .btn{display:block;width:100%;border:1px solid var(--red);border-radius:3px;padding:13px 14px;font:inherit;font-size:16px;font-weight:600;background:var(--red);color:var(--red-ink);cursor:pointer;text-align:center}
  .btn:hover{background:var(--red-dark);border-color:var(--red-dark)}
  .btn.sec{background:transparent;color:var(--ink);border-color:var(--ink)}
  .btn.sec:hover{background:var(--tint)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  input[type=text]{width:100%;padding:12px;font:inherit;font-size:18px;color:var(--ink);background:var(--surface);border:1px solid var(--mut);border-radius:3px;letter-spacing:.5px}
  input::placeholder{color:var(--mut)}
  .sep{height:1px;background:var(--line);margin:16px 0}
  #preview{width:100%;max-height:200px;object-fit:cover;border:1px solid var(--line);border-radius:3px;margin-top:12px;display:none}
  .status{font-size:14px;color:var(--mut);margin-top:10px;min-height:20px}
  #result{display:none;border-left:5px solid var(--red)}
  #result dl{margin:0}
  #result dt{font-size:13px;color:var(--mut);margin:0}
  #result dd{margin:0 0 12px}
  #result .name{font-size:34px;font-weight:700;line-height:1.15}
  #result .tag{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px}
  .badge{display:inline-block;padding:4px 10px;border-radius:3px;font-size:13px;font-weight:600}
  .badge.new{background:var(--newbg);color:var(--new)}
  .badge.old{background:var(--okbg);color:var(--ok)}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{text-align:left;font-size:13px;color:var(--mut);font-weight:600;padding:0 0 8px;border-bottom:2px solid var(--ink)}
  td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td.num,th.num{text-align:right;white-space:nowrap}
  td .t{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--mut)}
  .empty{color:var(--mut);font-size:14px}
  .link{background:none;border:0;color:var(--ink);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:4px 0}
  footer{max-width:560px;margin:0 auto;padding:0 16px 32px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div class="topbar"><div class="topin">
  <div class="org">Tierkennzeichnung</div>
  <h1>Ohrmarkenabfrage</h1>
  <p>Zuordnung von Rindern anhand der Ohrmarkennummer.</p>
  <button type="button" class="tbtn" id="themeBtn" aria-label="Darstellung wechseln" title="Hell / Dunkel">
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div></div>
<main>
  <section>
    <h2>Abfrage</h2>
    <input type="file" id="cam" accept="image/*" capture="environment" hidden>
    <button class="btn" id="scanBtn" type="button">Ohrmarke fotografieren</button>
    <img id="preview" alt="Foto der Ohrmarke">
    <div class="status" id="status" aria-live="polite"></div>
    <div class="sep"></div>
    <label for="tag">Ohrmarkennummer</label>
    <input type="text" id="tag" inputmode="numeric" placeholder="z. B. 120 1234 5678" autocomplete="off">
    <div style="margin-top:10px"><button class="btn sec" id="goBtn" type="button">Abfragen</button></div>
  </section>

  <section id="result" aria-live="polite">
    <h2>Ergebnis</h2>
    <dl>
      <dt>Name des Tieres</dt><dd class="name" id="rName"></dd>
      <dt>Ohrmarkennummer</dt><dd class="tag" id="rTag"></dd>
    </dl>
  </section>

  <section>
    <h2>Verlauf</h2>
    <table id="tbl" style="display:none">
      <thead><tr><th>Name / Ohrmarke</th><th class="num">Abfragen</th></tr></thead>
      <tbody id="list"></tbody>
    </table>
    <div class="empty" id="empty">Noch keine Abfragen.</div>
  </section>
  <div><button class="link" id="resetBtn" type="button">Verlauf löschen</button></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" async></script>
<script>
const NAMES = ["Berta","Heidi","Vreni","Resli","Blüemli","Zita","Gretl","Lisi","Fleckli","Mona","Nelly","Stella","Sonja","Flurina","Mengia","Annatina","Cilgia","Selina","Uorschla","Gianna","Bella","Lilly","Rosa","Frieda","Marlis","Trudi","Elsi","Ida","Hanni","Gerda","Alma","Pia","Sabina","Luzia","Margritli","Edelweiss","Alpina","Gamsli","Murmeli","Chäsli","Rösli","Zottel","Bimba","Trina","Dorli","Christa","Sepp-Line","Glöggli","Nora","Cäcilia","Chatrina","Madlaina","Mia","Tilda","Wiesli","Brunhilde","Jolanda","Kunigunde","Greta","Olga"];
// URL des Workers (nach dem Deployen eintragen). Leer = nur lokal auf diesem Gerät.
const API = "https://cow-api.zappa-pfadi.workers.dev";
const KEY = "kuh-scanner-v1";
let mem = {};
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || mem; }catch(e){ return mem; } }
function save(db){ mem = db; try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
const $ = id => document.getElementById(id);

function normalize(s){ return (s||"").replace(/\D/g,""); }
function pretty(d){ return d.replace(/(\d{3})(\d{4})(\d+)/,"$1 $2 $3"); }

function pickName(db){
  const used = new Set(Object.values(db).map(v=>v.name));
  const free = NAMES.filter(n=>!used.has(n));
  if(free.length) return free[Math.floor(Math.random()*free.length)];
  const base = NAMES[Math.floor(Math.random()*NAMES.length)];
  let i = 2; while(used.has(base+" "+i)) i++;
  return base+" "+i;
}

async function lookup(raw){
  const d = normalize(raw);
  if(d.length < 4){ $("status").textContent = "Bitte mindestens 4 Ziffern eingeben."; return; }
  const db = load();
  let name, isNew;
  if(API){
    $("status").textContent = "Abfrage läuft …";
    try{
      const r = await fetch(API + "/lookup?tag=" + d);
      if(!r.ok) throw new Error(r.status);
      const j = await r.json(); name = j.name; isNew = j.isNew;
      $("status").textContent = "";
    }catch(e){
      $("status").textContent = "Server nicht erreichbar. Bitte später erneut versuchen.";
      return;
    }
  } else {
    isNew = !db[d];
    name = isNew ? pickName(db) : db[d].name;
  }
  const rec = db[d] || {first: Date.now(), count: 0};
  rec.name = name; rec.count++; rec.last = Date.now();
  db[d] = rec; save(db);
  $("rName").textContent = rec.name;
  $("rTag").textContent = pretty(d);
  const r = $("result"); r.style.display = "block";
  r.scrollIntoView({behavior:"smooth", block:"nearest"});
  render();
}

function render(){
  const db = load();
  const entries = Object.entries(db).sort((a,b)=>b[1].last-a[1].last);
  $("empty").style.display = entries.length ? "none" : "block";
  $("tbl").style.display = entries.length ? "table" : "none";
  $("list").innerHTML = entries.map(([d,v])=>
    `<tr><td><b>${v.name}</b><div class="t">${pretty(d)}</div></td><td class="num">${v.count}</td></tr>`).join("");
}

// --- OCR ---
function bestNumber(text){
  let best = "";
  for(const line of text.split(/\n/)){
    const d = normalize(line);
    if(d.length > best.length) best = d;
  }
  return best.length >= 4 ? best : "";
}
async function ocr(file){
  // 1) native text detector (if browser has it)
  try{
    if("TextDetector" in window){
      const bmp = await createImageBitmap(file);
      const res = await new TextDetector().detect(bmp);
      const n = bestNumber(res.map(r=>r.rawValue).join("\n"));
      if(n) return n;
    }
  }catch(e){}
  // 2) Tesseract.js
  if(!window.Tesseract) throw new Error("no-ocr");
  const { data } = await Tesseract.recognize(file, "eng", {
    tessedit_char_whitelist: "0123456789CH ",
    logger: m => { if(m.status==="recognizing text") $("status").textContent = "Ohrmarke wird gelesen … " + Math.round(m.progress*100) + " %"; }
  });
  return bestNumber(data.text);
}

$("scanBtn").onclick = () => $("cam").click();
$("cam").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  const p = $("preview"); p.src = URL.createObjectURL(f); p.style.display = "block";
  $("status").textContent = "Ohrmarke wird gelesen …";
  try{
    const n = await ocr(f);
    if(n){ $("tag").value = pretty(n); $("status").textContent = "Erkannte Nummer: " + pretty(n); lookup(n); }
    else { $("status").textContent = "Nummer nicht erkannt. Bitte unten manuell eingeben."; $("tag").focus(); }
  }catch(err){
    $("status").textContent = "Automatische Erkennung nicht verfügbar. Bitte Nummer manuell eingeben.";
    $("tag").focus();
  }
  e.target.value = "";
};
$("goBtn").onclick = () => lookup($("tag").value);
$("tag").addEventListener("keydown", e => { if(e.key==="Enter") lookup($("tag").value); });

let armed = false;
$("resetBtn").onclick = () => {
  const b = $("resetBtn");
  if(!armed){ armed = true; b.textContent = "Wirklich löschen? Erneut antippen zur Bestätigung"; setTimeout(()=>{armed=false;b.textContent="Verlauf löschen";},4000); return; }
  save({}); armed = false; b.textContent = "Verlauf löschen"; $("result").style.display="none"; render();
};
render();

// --- Darstellung (hell / dunkel) ---
const TKEY = "ohrmarken-theme";
const mq = window.matchMedia("(prefers-color-scheme: dark)");
function effective(){
  const t = document.documentElement.getAttribute("data-theme");
  return t || (mq.matches ? "dark" : "light");
}
function paint(){
  const e = effective();
  document.documentElement.setAttribute("data-eff", e);
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", e === "dark" ? "#1d2125" : "#ffffff");
}
function setTheme(t, persist){
  if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  paint();
  if(persist){ try{ localStorage.setItem(TKEY, t); }catch(e){} }
}
$("themeBtn").onclick = () => setTheme(effective() === "dark" ? "light" : "dark", true);
mq.addEventListener && mq.addEventListener("change", paint);
let saved = "auto"; try{ saved = localStorage.getItem(TKEY) || "auto"; }catch(e){}
setTheme(saved, false);
</script>
</body>
</html>
